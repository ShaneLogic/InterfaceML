[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "interfaceml"
version = "1.0.0"
description = "A professional toolkit for heterojunction modeling and DFT calculations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Interface Modeling Lab", email = "interface@example.com"},
]
keywords = ["heterojunction", "DFT", "materials-science", "perovskite", "solar-cell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.22.0",
    "pymatgen>=2022.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "werkzeug>=2.0.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
ai = [
    "torch>=1.12.0",
    "torch-geometric>=2.0.0",
    "scipy>=1.7.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.62.0",
]
async = [
    "celery[redis]>=5.3.0",
    "redis>=4.5.0",
]
perf = [
    "scipy>=1.7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
interfaceml-build = "interfaceml.cli.build_interface:main"
interfaceml-fix = "interfaceml.cli.fix_layers:main"
interfaceml-web = "interfaceml.web.app:main"

[project.urls]
Homepage = "https://github.com/yourusername/InterfaceML"
Documentation = "https://github.com/yourusername/InterfaceML#readme"
Repository = "https://github.com/yourusername/InterfaceML"
Issues = "https://github.com/yourusername/InterfaceML/issues"

[tool.setuptools.packages.find]
include = ["interfaceml*"]

[tool.setuptools.package-data]
"interfaceml.web" = ["static/**/*", "templates/**/*"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["interfaceml"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
